name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen source and regression gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: python scripts/check_secrets.py

      - name: Zero-cost policy
        run: python scripts/check_zero_cost_policy.py

      - name: Public-candidate privacy scan
        run: python scripts/check_public_candidate.py

      - name: Git large-file policy
        run: python scripts/check_git_large_files.py

      - name: Frozen specifications and canonical source hashes
        run: python scripts/check_frozen_hashes.py

      - name: Backend suites and baseline floors
        run: python scripts/run_c0_backend_checks.py

      - name: Frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Python compile check
        run: python -m compileall -q backend scripts

      - name: Next.js production build
        working-directory: frontend
        run: pnpm build
