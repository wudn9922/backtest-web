services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /data
      CACHE_DIR: /data/cache
      DATABASE_URL: sqlite:////data/backtests.sqlite3
      ALLOWED_ORIGINS: https://${DOMAIN}
      ALLOWED_HOSTS: ${DOMAIN},backend
      MAX_REQUEST_BYTES: 1048576
      YAHOO_REQUEST_TIMEOUT_SECONDS: ${YAHOO_REQUEST_TIMEOUT_SECONDS:-20}
      YAHOO_MAX_RETRIES: ${YAHOO_MAX_RETRIES:-3}
      YAHOO_RETRY_BACKOFF_SECONDS: ${YAHOO_RETRY_BACKOFF_SECONDS:-1}
      YAHOO_STATUS_TIMEOUT_SECONDS: ${YAHOO_STATUS_TIMEOUT_SECONDS:-3}
      YAHOO_OFFLINE_COOLDOWN_SECONDS: ${YAHOO_OFFLINE_COOLDOWN_SECONDS:-300}
      YAHOO_STATUS_CACHE_SECONDS: ${YAHOO_STATUS_CACHE_SECONDS:-60}
      STOOQ_REQUEST_TIMEOUT_SECONDS: ${STOOQ_REQUEST_TIMEOUT_SECONDS:-20}
      STOOQ_MAX_RETRIES: ${STOOQ_MAX_RETRIES:-2}
      STOOQ_RETRY_BACKOFF_SECONDS: ${STOOQ_RETRY_BACKOFF_SECONDS:-1}
      STOOQ_STATUS_TIMEOUT_SECONDS: ${STOOQ_STATUS_TIMEOUT_SECONDS:-3}
      STOOQ_STATUS_CACHE_SECONDS: ${STOOQ_STATUS_CACHE_SECONDS:-60}
      STOOQ_OFFLINE_COOLDOWN_SECONDS: ${STOOQ_OFFLINE_COOLDOWN_SECONDS:-300}
    volumes:
      - backtest_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backtest_data:
  caddy_data:
  caddy_config:
